# Two tiers, deliberately:
#   depot-storage : dufs, storage only, reachable on the stack's internal
#                   network and nowhere else.
#   depot-web     : the gateway. The only thing published, the only thing the
#                   browser talks to, and therefore the only thing that decides
#                   authentication. That is what allows a real sign-in page
#                   instead of the dialog HTTP Basic forces.
#
# DEPOT_DATA must point at the same folder as the SFTP account: both routes end
# up on the same files.

services:
  depot-storage:
    image: sigoden/dufs:v0.46.0
    restart: unless-stopped
    user: "${DEPOT_UID:-1001}:${DEPOT_GID:-1001}"
    command: ["-c", "/config.yaml"]
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ${DEPOT_DATA:-/srv/depot/upload}:/data
    expose:
      - "5000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  depot-web:
    build: ./gateway
    image: depot-gw:1
    restart: unless-stopped
    user: "${DEPOT_UID:-1001}:${DEPOT_GID:-1001}"
    depends_on:
      - depot-storage
    volumes:
      - ./gateway/config.json:/etc/depot-gw/config.json:ro
      # read-only, only to report how full the volume is
      - ${DEPOT_DATA:-/srv/depot/upload}:/data:ro
    ports:
      # 127.0.0.1 by default: publishing is the reverse proxy's job
      - "${DEPOT_BIND:-127.0.0.1}:8099:5100"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
