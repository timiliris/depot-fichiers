# dufs configuration (the storage tier).
# It is never published: only the gateway reaches it, over the stack network.
serve-path: /data
bind: 0.0.0.0
port: 5000

allow-upload: true
allow-archive: true
allow-search: true

# allow-delete is not a convenience. Without it an interrupted upload leaves a
# partial file that no request can overwrite, and that filename is blocked for
# good. It is also the permission that makes resuming possible.
allow-delete: true

# Kept as defence in depth even on an internal network. The gateway sets the
# matching header through `upstream_auth`; the browser never sees it, and so
# never gets the native credential dialog.
auth:
  - "storage:CHANGE-ME@/:rw"
